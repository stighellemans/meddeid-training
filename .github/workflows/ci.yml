name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install compatible evaluation source and test requirements
        run: |
          python -m pip install \
            'meddeid-eval @ git+https://github.com/stighellemans/meddeid-eval.git@8236305293cc27ecbc8100fa43581789190b05c8'
          python -m pip install '.[dev]' build twine
          python -m pip check
      - run: pytest -q
      - name: Build and inspect distributions
        if: matrix.python-version == '3.12'
        run: |
          python -m build
          python -m twine check dist/*
